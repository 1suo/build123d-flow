name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solidcore-spike
      - name: Build SolidCore WebAssembly smoke test
        working-directory: solidcore-spike
        run: wasm-pack build --target web --release --out-dir ../public/solidcore-test/pkg
        env:
          RUSTFLAGS: "-C link-arg=-zstack-size=8388608"
      - name: Cache staged Pyodide runtime
        id: pyodide-cache
        uses: actions/cache@v4
        with:
          path: public/pyodide/v314.0.7/full
          key: pyodide-314.0.7-${{ hashFiles('scripts/prepare-pyodide.py', 'public/python/setup.py') }}
      - name: Download and stage self-hosted Pyodide runtime
        if: steps.pyodide-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --output /tmp/pyodide-314.0.7.tar.bz2 https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-314.0.7.tar.bz2
          echo "192b5864e6e6d30ab074861af800cb8b4acb0998ef0f9342c3367448aeb86645  /tmp/pyodide-314.0.7.tar.bz2" | sha256sum --check
          python scripts/prepare-pyodide.py /tmp/pyodide-314.0.7.tar.bz2 public/pyodide/v314.0.7/full public/python/setup.py
      - run: npm install
      - run: npm run typecheck
      - run: python -m py_compile public/python/flow_runtime.py tests/graph_workflows.py
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
