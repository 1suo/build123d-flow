name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache staged Pyodide runtime
        id: pyodide-staged-cache
        uses: actions/cache@v4
        with:
          path: |
            public/pyodide/v314.0.7/full
            public/python/wheels
          key: pyodide-staged-314.0.7-${{ hashFiles('scripts/prepare-pyodide.py', 'public/python/setup.py') }}
      - name: Cache Pyodide source archive
        id: pyodide-archive-cache
        if: steps.pyodide-staged-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/pyodide-314.0.7.tar.bz2
          key: pyodide-archive-314.0.7-192b5864e6e6d30ab074861af800cb8b4acb0998ef0f9342c3367448aeb86645
      - name: Download Pyodide source archive
        if: steps.pyodide-staged-cache.outputs.cache-hit != 'true' && steps.pyodide-archive-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --output /tmp/pyodide-314.0.7.tar.bz2 https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-314.0.7.tar.bz2
      - name: Verify and stage self-hosted Pyodide runtime
        if: steps.pyodide-staged-cache.outputs.cache-hit != 'true'
        run: |
          echo "192b5864e6e6d30ab074861af800cb8b4acb0998ef0f9342c3367448aeb86645  /tmp/pyodide-314.0.7.tar.bz2" | sha256sum --check
          python scripts/prepare-pyodide.py /tmp/pyodide-314.0.7.tar.bz2 public/pyodide/v314.0.7/full public/python/setup.py public/python/wheels
      - run: npm install
      - name: Build production bundle
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_E2E_TEST_HOOKS: "true"
      - name: Stage focused graph workflow tests for the browser runtime
        run: cp tests/graph_workflows.py dist/python/graph_workflows.py
      - name: Typecheck
        run: npm run typecheck
      - name: Compile Python sources
        run: python -m py_compile public/python/flow_runtime.py tests/graph_workflows.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Remove browser-only test payload
        if: always()
        run: rm -f dist/python/graph_workflows.py
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
